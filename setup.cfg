[metadata]
name = drtools
version = 4.0.0
author = Andrey Malheiros
author_email = andreylcj@email.com
description = Kit of MY useful tools.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/andreylcj/drtools
project_urls =
    repository = https://github.com/andreylcj/drtools
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    requests
    pytz
    python-dateutil

[options.extras_require]
data_science =
    pandas
    numpy
    scikit-learn
    seaborn
    matplotlib
    joblib
    tldextract
database =
    psycopg2-binary
google =
    google-auth
    google-auth-httplib2
    google-api-python-client
    gspread
    oauth2client
web_automation =
    selenium
    seleniumwire
    webdriver-manager
    fake-useragent
all =
    %(data_science)s
    %(database)s
    %(google)s
    %(web_automation)s

[options.packages.find]
where = src